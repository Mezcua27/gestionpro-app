<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar sesión</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-gray-900 to-blue-950 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <span class="text-4xl font-bold text-blue-400">⚙ GestiónPro</span>
      <p class="text-gray-400 mt-2 text-sm">Accede a tu empresa</p><!-- v7703e61 -->
    </div>
    <div class="bg-white rounded-2xl shadow-xl p-8">
      <h2 class="text-2xl font-bold text-gray-800 mb-6">Iniciar sesión</h2>
      <div id="error" class="hidden mb-4 bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 text-sm"></div>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" name="email" required autocomplete="email"
            class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
          <input type="password" name="password" required autocomplete="current-password"
            class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"/>
        </div>
        <button type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition">
          Entrar
        </button>
      </form>
      <div class="mt-4 text-center">
        <a href="/recuperar" class="text-sm text-gray-400 hover:text-blue-600 transition">¿Olvidaste tu contraseña?</a>
      </div>
      <p class="mt-3 text-center text-sm text-gray-500">
        ¿Primera vez? <a href="/registro" class="text-blue-600 hover:underline font-medium">Registra tu empresa</a>
      </p>
    </div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const f = e.target;
      const errEl = document.getElementById('error');
      errEl.classList.add('hidden');
      try {
        const r = await fetch('/auth/login', {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: f.email.value, password: f.password.value })
        });
        if (!r.ok) {
          const d = await r.json();
          errEl.textContent = d.detail || 'Error al iniciar sesión';
          errEl.classList.remove('hidden');
          return;
        }
        window.location = '/dashboard';
      } catch {
        errEl.textContent = 'Error de conexión';
        errEl.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
